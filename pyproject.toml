[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ape*"]

[project]
name = "ape"
version = "0.1.0"
description = "Atomic Proposition Embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.8.4",
    "huggingface-hub>=1.0.0",
    "numpy",
    "safetensors>=0.4.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch==2.10.0",
    "tqdm",
    "transformers>=5.5.0",
]
